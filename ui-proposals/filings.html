<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordia 届出</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/shell.js"></script>
</head>
<body data-nav="filing" data-crumbs="届出">
<div data-page class="content">
  <div class="page-head">
    <div><h1>届出</h1><div class="meta">手続きの中で作った届出が、期限の近い順に並びます。提出はここからでも手続きの中からでもできます。</div></div>
    <div class="actions"><button class="btn">CSVで書き出す</button></div>
  </div>
  <section class="card">
    <div class="tabs">
      <button class="on">未提出 <span class="badge">4</span></button>
      <button>提出済み</button>
      <button>すべて</button>
    </div>
    <div class="toolbar chips">
      <input class="input" placeholder="届出の名前・氏名で探す">
      <span class="grow"></span>
      <button class="chip on">すべての状態</button>
      <button class="chip">作成中 <span class="n">1</span></button>
      <button class="chip">承認待ち <span class="n">1</span></button>
      <button class="chip">提出できる <span class="n">2</span></button>
    </div>
    <div class="table-wrap">
      <table class="list">
        <thead><tr><th>届出</th><th>対象</th><th>手続き</th><th>提出方法</th><th>提出期限</th><th>状態</th><th></th></tr></thead>
        <tbody>
          <tr><td><b>健康保険・厚生年金保険 賞与支払届</b></td><td>8名</td><td><a href="bonus.html">賞与 10月支給</a></td><td>電子申請</td><td><span class="due over">10/30（今日）</span></td><td><span class="pill ok">提出できる</span></td><td class="r"><button class="btn sm primary">提出する</button></td></tr>
          <tr><td><b>被保険者資格喪失届</b></td><td>佐々木 恵</td><td><a href="#">退職</a></td><td>電子申請</td><td><span class="due soon">11/4（水）</span></td><td><span class="pill you">作成中</span></td><td class="r"><button class="btn sm">続きを作る</button></td></tr>
          <tr><td><b>被保険者資格取得届</b></td><td>田中 直樹 ほか2名</td><td><a href="onboarding.html">入社 11/1</a></td><td>電子申請</td><td><span class="due soon">11/5（木）</span></td><td><span class="pill wait">手続きの途中</span></td><td class="r"><button class="btn sm ghost">手続きを開く</button></td></tr>
          <tr><td><b>被扶養者（異動）届</b></td><td>伊藤 美咲</td><td><a href="approvals.html">扶養の変更</a></td><td>紙</td><td><span class="due">11/30（月）</span></td><td><span class="pill warn">承認待ち</span></td><td class="r"><button class="btn sm ghost">内容を見る</button></td></tr>
        </tbody>
      </table>
    </div>
    <div class="table-foot">期限が土日祝の場合は翌開庁日で表示しています</div>
  </section>
</div>
</body>
</html>
