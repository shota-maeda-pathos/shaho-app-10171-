<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordia 賞与</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/shell.js"></script>
</head>
<body data-nav="proc" data-crumbs="手続き|賞与 2026年10月支給">
<div data-page class="content">
  <div class="page-head">
    <div>
      <div class="kicker"><span class="tag">まとめて</span>賞与</div>
      <h1>2026年10月支給の賞与</h1>
      <div class="meta"><span>支給日 10/25</span><span>対象 <b>8名</b></span><span>賞与支払届の期限 <b class="due over">10/30（今日）</b></span></div>
    </div>
    <div class="actions">
      <button class="btn ghost">履歴</button>
      <button class="btn">CSVを取り込む</button>
    </div>
  </div>

  <!-- 全手続き共通のステップ。数字はここに入れ、別のカードは作らない -->
  <nav class="stepper" id="stepper" aria-label="賞与のステップ"></nav>

  <section class="card">
    <div class="lead">
      <h2 id="step-title"></h2>
      <p id="step-lead"></p>
      <div class="right">
        <details class="why">
          <summary>ⓘ 詳しく</summary>
          <div class="pop"><dl><dt>なぜ必要か</dt><dd id="step-why"></dd><dt>この後</dt><dd id="step-next"></dd></dl></div>
        </details>
      </div>
    </div>
    <div class="toolbar chips" id="chips"></div>
    <div class="table-wrap">
      <table class="list">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="table-foot">名前を押すと、1人分の内訳が右に開きます</div>
  </section>
</div>

<div class="actionbar" id="actionbar">
  <div class="info" id="sel-info"></div>
  <div class="right">
    <span class="next" id="sel-next"></span>
    <button class="btn" id="secondary"></button>
    <button class="btn primary" id="primary"></button>
  </div>
</div>

<div class="drawer-scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="1人分の内訳">
  <div class="drawer-head">
    <div><div class="kicker" id="d-no"></div><h2 id="d-name"></h2></div>
    <button class="x" id="d-close" aria-label="閉じる">×</button>
  </div>
  <div class="drawer-body">
    <div class="section-title">今回の支給</div>
    <dl class="kv"><dt>支給日</dt><dd>2026/10/25</dd><dt>賞与額（通貨）</dt><dd id="d-amt"></dd><dt>現物</dt><dd>0円</dd><dt>標準賞与額</dt><dd id="d-std"></dd></dl>
    <div class="section-title">保険料</div>
    <dl class="kv"><dt>健康保険</dt><dd id="d-h"></dd><dt>介護保険</dt><dd>対象外（40歳未満）</dd><dt>厚生年金</dt><dd id="d-p"></dd></dl>
    <div class="section-title">年度の累計（健保の上限 573万円）</div>
    <dl class="kv"><dt>4月からの累計</dt><dd id="d-sum"></dd><dt>今年度の支給回数</dt><dd>2回</dd></dl>
    <div class="section-title">記録</div>
    <ul class="timeline small"><li><div class="when">10/28 山本</div>CSVで取り込み</li><li><div class="when">10/29 高橋</div>賞与額を承認</li><li><div class="when">10/29 山本</div>保険料を計算</li></ul>
  </div>
  <div class="drawer-foot"><button class="btn">保留にする</button><button class="btn">賞与額を直す</button></div>
</aside>

<script>
  var people = [
    ['田中 直樹', 'EMP-001', 858000, 'ok'], ['佐藤 一郎', 'EMP-002', 1404000, 'ok'], ['鈴木 花子', 'EMP-003', 1200000, 'ok'],
    ['高橋 健太', 'EMP-004', 2000000, 'warn'], ['伊藤 美咲', 'EMP-005', 640000, 'hold'], ['渡辺 翔太', 'EMP-006', 760000, 'ok'],
    ['山本 彩', 'EMP-007', 880000, 'ok'], ['小林 悠', 'EMP-008', 1100000, 'ok']
  ];
  var yen = function (n) { return n.toLocaleString('ja-JP') + '円'; };
  var std = function (n) { return Math.min(Math.floor(n / 1000) * 1000, 1500000); };

  var STEPS = [
    { key: 'entry', label: '賞与の登録', count: '8名 登録済み', done: true,
      lead: 'この月に支給した賞与を、CSVか1人ずつで登録します。',
      why: '保険料と賞与支払届は、登録した支給額（通貨と現物）から計算します。',
      next: '登録した賞与額を、別の担当者に承認してもらいます。',
      cols: ['賞与額', '支給回数'], cell: function (p) { return [yen(p[2]), '1回']; },
      chips: [['すべて', 8]], primary: '承認を依頼する', secondary: '1人追加' },
    { key: 'review', label: '賞与額の承認', count: '8名 承認済み', done: true,
      lead: '登録した賞与額を確かめ、承認を依頼します。',
      why: '承認された賞与額だけが保険料と届出に使われます。承認後は差し戻さないと直せません。',
      next: '承認された人の保険料を計算します。',
      cols: ['賞与額', '標準賞与額'], cell: function (p) { return [yen(p[2]), yen(std(p[2]))]; },
      chips: [['すべて', 8], ['承認済み', 8]], primary: '承認を依頼する', secondary: '差し戻す' },
    { key: 'premium', label: '保険料の計算', count: '7/8名 承認済み', done: true, attn: '1名 要確認',
      lead: '標準賞与額から保険料を計算し、承認を依頼します。',
      why: '賞与の保険料は賞与から控除します。計算の誤りは過少控除につながるため、別の目で確かめます。上限・免除・70歳以上はシステムが判定します。',
      next: '保険料が承認された人で賞与支払届を作ります。',
      cols: ['標準賞与額', '本人負担', '会社負担'], cell: function (p) { var s = std(p[2]); return [yen(s), yen(Math.round(s * .0995 / 2) + Math.round(s * .183 / 2)), yen(Math.round(s * .0995 / 2) + Math.round(s * .183 / 2))]; },
      chips: [['すべて', 8], ['要確認', 1], ['保留', 1]], primary: '承認を依頼する', secondary: '計算し直す' },
    { key: 'filing', label: '届出の提出', count: '期限 10/30', current: true,
      lead: '保険料が承認された人をまとめて、賞与支払届を1件作って提出します。',
      why: '賞与支払届は支給日から5日以内に、事業所の全員分をまとめて提出します。資格喪失月の支給や免除中の人も届け出ます。',
      next: 'すべて提出すれば、この月の賞与は完了です。',
      cols: ['標準賞与額', '届出'], cell: function (p) { return [yen(std(p[2])), p[3] === 'ok' ? '<span class="sub">載せる</span>' : '<span class="sub">—</span>']; },
      chips: [['すべて', 8], ['届出に載せる', 6], ['要確認', 1], ['保留', 1]], primary: '賞与支払届を作る', secondary: 'PDFで確認' }
  ];
  var cur = 3;
  var selected = {};

  function status(p) {
    if (p[3] === 'warn') return '<span class="pill warn">上限を確認</span><div class="sub">年度累計が573万円を超えます</div>';
    if (p[3] === 'hold') return '<span class="pill wait">保留</span><div class="sub">支給額を本人に確認中</div>';
    return cur === 3 ? '<span class="pill you">作成待ち</span>' : '<span class="pill ok">完了</span>';
  }

  function render() {
    var s = STEPS[cur];
    document.getElementById('stepper').innerHTML = STEPS.map(function (x, i) {
      var cls = (i === cur ? 'cur ' : '') + (x.done && i !== cur ? 'done ' : '') + (x.attn ? 'attn' : '');
      var dot = x.done && i !== cur ? '✓' : i + 1;
      return '<button class="' + cls + '" data-i="' + i + '"><span class="dot">' + dot + '</span><span class="t"><b>' + x.label + '</b><span>' + (x.attn || x.count) + '</span></span></button>';
    }).join('');
    document.getElementById('step-title').textContent = s.label;
    document.getElementById('step-lead').textContent = s.lead;
    document.getElementById('step-why').textContent = s.why;
    document.getElementById('step-next').textContent = s.next;
    document.getElementById('chips').innerHTML = '<input class="input" placeholder="氏名・社員番号で探す"><span class="grow"></span>' +
      s.chips.map(function (c, i) { return '<button class="chip' + (i ? '' : ' on') + '">' + c[0] + ' <span class="n">' + c[1] + '</span></button>'; }).join('');
    document.getElementById('thead').innerHTML = '<tr><th class="chk"><input type="checkbox" id="all"></th><th>従業員</th>' +
      s.cols.map(function (c) { return '<th class="r">' + c + '</th>'; }).join('') + '<th>状態</th></tr>';
    document.getElementById('tbody').innerHTML = people.map(function (p, i) {
      var can = p[3] === 'ok';
      return '<tr data-i="' + i + '" class="' + (selected[i] ? 'sel' : '') + '"><td class="chk"><input type="checkbox" ' + (can ? '' : 'disabled ') + (selected[i] ? 'checked' : '') + '></td>' +
        '<td class="who"><b>' + p[0] + '</b><span>' + p[1] + '</span></td>' +
        s.cell(p).map(function (c) { return '<td class="r num">' + c + '</td>'; }).join('') + '<td>' + status(p) + '</td></tr>';
    }).join('');
    updateBar();
  }

  function updateBar() {
    var s = STEPS[cur];
    var n = Object.keys(selected).filter(function (k) { return selected[k]; }).length;
    document.getElementById('sel-info').innerHTML = n ? '<b>' + n + '名</b>を選択中' : '処理する人を選んでください（要確認・保留の人は選べません）';
    var pb = document.getElementById('primary');
    pb.textContent = s.primary + (n ? '（' + n + '名）' : '') + ' →';
    pb.disabled = !n;
    document.getElementById('secondary').textContent = s.secondary;
    document.getElementById('sel-next').textContent = n ? '次：' + s.next : '';
  }

  document.addEventListener('click', function (e) {
    var st = e.target.closest('#stepper button');
    if (st) { cur = +st.getAttribute('data-i'); render(); return; }
    if (e.target.id === 'all') {
      people.forEach(function (p, i) { if (p[3] === 'ok') selected[i] = e.target.checked; });
      render(); return;
    }
    var tr = e.target.closest('#tbody tr');
    if (!tr) return;
    var i = +tr.getAttribute('data-i');
    if (e.target.matches('input[type=checkbox]') || e.target.closest('td.chk')) {
      if (people[i][3] !== 'ok') return;
      selected[i] = !selected[i];
      render(); return;
    }
    openDrawer(people[i]);
  });

  function openDrawer(p) {
    var s = std(p[2]);
    document.getElementById('d-no').textContent = p[1];
    document.getElementById('d-name').textContent = p[0];
    document.getElementById('d-amt').textContent = yen(p[2]);
    document.getElementById('d-std').textContent = yen(s);
    document.getElementById('d-h').textContent = yen(Math.round(s * .0995 / 2)) + '（本人） / ' + yen(Math.round(s * .0995 / 2)) + '（会社）';
    document.getElementById('d-p').textContent = yen(Math.round(s * .183 / 2)) + '（本人） / ' + yen(Math.round(s * .183 / 2)) + '（会社）';
    document.getElementById('d-sum').textContent = yen(s + (p[3] === 'warn' ? 4200000 : 820000));
    document.getElementById('drawer').classList.add('open');
    document.getElementById('scrim').classList.add('open');
  }
  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('scrim').classList.remove('open');
  }
  document.getElementById('scrim').addEventListener('click', closeDrawer);
  document.getElementById('d-close').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });
  render();
</script>
</body>
</html>
